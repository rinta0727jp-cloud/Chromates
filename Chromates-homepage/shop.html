<!DOCTYPE html>
<html lang="ja">

<head>
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>SHOP | ChroMates</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- HEADER -->
  <header class="header">

    <a href="index.html" class="site-logo">
      <strong>ChroMates</strong>
      <span>FUTSAL CIRCLE</span>
    </a>

    <nav class="nav">
      <a href="index.html">HOME</a>
      <a href="news.html">NEWS</a>
      <a href="index.html#about">ABOUT</a>
      <a href="index.html#schedule">SCHEDULE</a>
      <a href="index.html#calendar">CALENDAR</a>
      <a href="shop.html">SHOP</a>
      <a href="index.html#join">JOIN US</a>
    </nav>

  </header>


  <!-- SHOP -->
  <main class="shop-page">

    <section class="shop-inner">

      <div class="shop-heading">

        <p>08 / SHOP</p>

        <h1>OFFICIAL GOODS</h1>

        <span>
          ChroMatesオフィシャルグッズ
        </span>

      </div>


      <!-- PRE ORDER NOTICE -->
      <div class="shop-notice">

        <div>
          <span>PRE-ORDER</span>
          <h2>予約販売受付中</h2>
        </div>

        <p>
          すべての商品は予約販売となります。<br>
          ご予約後、支払い方法・受け渡し方法についてご連絡します。
        </p>

      </div>


      <!-- GOODS -->
      <div
        class="goods-grid"
        id="goods-grid"
      >
      </div>

    </section>

  </main>


  <!-- FOOTER -->
  <footer class="footer">

    <div class="footer-logo">
      <strong>ChroMates</strong>
      <span>FUTSAL CIRCLE</span>
    </div>

    <nav class="footer-nav">
      <a href="index.html">HOME</a>
      <a href="news.html">NEWS</a>
      <a href="index.html#about">ABOUT</a>
      <a href="index.html#schedule">SCHEDULE</a>
      <a href="shop.html">SHOP</a>
      <a href="index.html#join">JOIN US</a>
    </nav>

    <p>© 2026 ChroMates</p>

  </footer>


  <script src="goods-data.js"></script>

  <script>

    const goodsGrid =
      document.getElementById("goods-grid");

    goodsData.forEach(item => {

      const card =
        document.createElement("a");

      card.href =
        `product.html?id=${item.id}`;

      card.className =
        "goods-card";

      card.innerHTML = `

        <div class="goods-image">

          <img
            src="${item.image}"
            alt="${item.jpName}"
          >

          <span class="goods-status">
            ${item.status}
          </span>

        </div>


        <div class="goods-info">

          <p class="goods-name-en">
            ${item.name}
          </p>

          <h2>
            ${item.jpName}
          </h2>

          <strong class="goods-price">
            ${item.price}
          </strong>

          <span class="goods-view">
            VIEW ITEM →
          </span>

        </div>

      `;

      goodsGrid.appendChild(card);

    });

  </script>

</body>
</html>
