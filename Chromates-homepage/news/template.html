<!DOCTYPE html>
<html lang="ja">

<head>
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>記事タイトル | ChroMates</title>

  <link rel="stylesheet" href="../style.css">
</head>

<body>

  <!-- HEADER -->
  <header class="header">

    <a href="../index.html" class="site-logo">
      <strong>ChroMates</strong>
      <span>FUTSAL CIRCLE</span>
    </a>

    <nav class="nav">
      <a href="../index.html">HOME</a>
      <a href="../news.html">NEWS</a>
      <a href="../index.html#about">ABOUT</a>
      <a href="../index.html#schedule">SCHEDULE</a>
      <a href="../index.html#calendar">CALENDAR</a>
      <a href="../index.html#uniform">UNIFORM</a>
      <a href="../index.html#join">JOIN US</a>
    </nav>

  </header>


  <!-- NEWS ARTICLE -->
  <main class="article-page">

    <article class="article-inner">

      <!-- 記事上部 -->
      <div class="article-header">

        <a href="../news.html" class="article-back">
          ← NEWS
        </a>

        <!-- ↓ 記事を作るときに変更 -->
        <time>2026.00.00</time>

        <!-- ↓ 記事を作るときに変更 -->
        <h1>
          ここにニュースのタイトルを入力
        </h1>

      </div>


      <!-- メイン画像 -->
      <div class="article-image">

        <!--
          記事を作るときに画像を変更
          例：
          <img src="../images/team.jpg" alt="大会の様子">
        -->

        <img
          src="../images/team.jpg"
          alt="ChroMates"
        >

      </div>


      <!-- 記事本文 -->
      <div class="article-body">

        <!-- ↓ ここから本文を変更 -->

        <p>
          ここにニュースの本文を入力します。
        </p>

        <p>
          大会結果や活動内容、チームからのお知らせなどを
          自由に記載できます。
        </p>

        <!-- ↑ ここまで本文を変更 -->

      </div>


      <div class="article-bottom">

        <a href="../news.html">
          ← NEWS一覧へ戻る
        </a>

      </div>

    </article>

  </main>


  <!-- FOOTER -->
  <footer class="footer">

    <div class="footer-logo">
      <strong>ChroMates</strong>
      <span>FUTSAL CIRCLE</span>
    </div>

    <nav class="footer-nav">
      <a href="../index.html">HOME</a>
      <a href="../news.html">NEWS</a>
      <a href="../index.html#about">ABOUT</a>
      <a href="../index.html#schedule">SCHEDULE</a>
      <a href="../index.html#uniform">UNIFORM</a>
      <a href="../index.html#join">JOIN US</a>
    </nav>

    <p>© 2026 ChroMates</p>

  </footer>

</body>
</html>
