<!DOCTYPE html>
<html lang="ja">

<head>
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>NEWS | ChroMates</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header class="header">

    <a href="index.html" class="site-logo">
      <strong>ChroMates</strong>
      <span>FUTSAL CIRCLE</span>
    </a>

    <nav class="nav">
      <a href="index.html">HOME</a>
      <a href="news.html">NEWS</a>
      <a href="index.html#about">ABOUT</a>
      <a href="index.html#schedule">SCHEDULE</a>
      <a href="index.html#calendar">CALENDAR</a>
      <a href="index.html#uniform">UNIFORM</a>
      <a href="index.html#join">JOIN US</a>
    </nav>

  </header>


  <main class="news-page">

    <section class="news-page-inner">

      <div class="news-page-heading">

        <p>01 / NEWS</p>

        <h1>
          NEWS
        </h1>

        <span>
          ChroMatesの最新情報
        </span>

      </div>


      <div
        class="news-page-list"
        id="news-page-list"
      >
      </div>

    </section>

  </main>


  <footer class="footer">

    <div class="footer-logo">
      <strong>ChroMates</strong>
      <span>FUTSAL CIRCLE</span>
    </div>

    <nav class="footer-nav">
      <a href="index.html">HOME</a>
      <a href="news.html">NEWS</a>
      <a href="index.html#about">ABOUT</a>
      <a href="index.html#schedule">SCHEDULE</a>
      <a href="index.html#uniform">UNIFORM</a>
      <a href="index.html#join">JOIN US</a>
    </nav>

    <p>
      © 2026 ChroMates
    </p>

  </footer>


  <script src="news-data.js"></script>

  <script>
    const newsPageList =
      document.getElementById("news-page-list");

    if (newsData.length === 0) {

      newsPageList.innerHTML = `
        <div class="news-empty">
          <p>現在お知らせはありません。</p>
        </div>
      `;

    } else {

      newsData.forEach(news => {

        const item =
          document.createElement("a");

        item.href = news.url;

        item.className =
          "news-page-item";

        item.innerHTML = `
          <time>${news.date}</time>

          <span>${news.title}</span>

          <b>→</b>
        `;

        newsPageList.appendChild(item);

      });

    }
  </script>

</body>
</html>
